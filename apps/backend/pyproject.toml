[project]
name = "demo-agent"
version = "0.1.0"
description = "Arnessa Demo Agent"
requires-python = ">=3.13"
dependencies = [
    "arnessa",
    "subagents-pydantic-ai==0.2.1",
    "pydantic-ai-shields==0.3.1",
    "logfire",
]

[tool.uv.sources]
arnessa = { workspace = true }

[project.scripts]
arnessa-agui = "demo_agent.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require real infrastructure (deselect with '-m not integration')",
]

[tool.hatch.build.targets.wheel]
packages = ["src/demo_agent"]
