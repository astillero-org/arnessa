[project]
name = "arnessa-workspace"
version = "0.1.0"
description = "Workspace root for Arnessa"
requires-python = ">=3.13"
dependencies = [
    "arnessa",
]

[tool.uv.sources]
arnessa = { workspace = true }

[tool.uv.workspace]
members = ["apps/backend", "packages/arnessa"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps/backend/tests"]
asyncio_mode = "auto"
