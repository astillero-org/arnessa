[project]
name = "arnessa"
version = "0.1.0"
description = "Arnessa Python SDK"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai==1.81.0",
    "starlette==0.52.1",
    "python-dotenv==1.2.2",
    "google-genai==1.73.0",
    "basicsr==1.4.2",
    "realesrgan==0.3.0",
    "pillow==12.2.0",
    "tqdm==4.67.3",
    "opencv-python==4.13.0.92",
    "pydantic-ai-skills==0.7.0",
    "pydantic-ai-backend>=0.2.4",
    "pydantic-ai-harness>=0.1.1",
    "rembg[cpu]>=2.0.75",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arnessa"]
